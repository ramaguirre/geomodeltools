[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geomodeltools"
version = "0.3.0"
description = "Utilities for 3D geological modeling with GeoPandas and DEM workflows."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "A. M. S. Team" }
]
license = "MIT"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "geopandas>=0.14",
  "shapely>=2.0",
  "rasterio>=1.3",
  "requests>=2.31",
  "scipy>=1.10",
  "matplotlib>=3.7"
]

[project.optional-dependencies]
viz = ["pyvista>=0.43"]
dev = ["pytest>=7"]

[project.scripts]
geomodeltools-eda = "geomodeltools.cli:eda_main"
geomodeltools-contact = "geomodeltools.cli:contact_main"
geomodeltools-report = "geomodeltools.cli:report_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
geomodeltools = ["static/*.js"]
